<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>平行人生販賣機 | Parallel Life Vending</title>
  <style>
    :root {
      --cream: #F6F0E1;
      --cream-dark: #E8DEC8;
      --orange: #E05A36;
      --orange-dark: #B84223;
      --green: #1E463A;
      --green-light: #2D6252;
      --ink: #172B24;
      --gold: #E5A93C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--cream);
      background-image:
        radial-gradient(var(--cream-dark) 1.5px, transparent 1.5px),
        radial-gradient(var(--cream-dark) 1.5px, var(--cream) 1.5px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      color: var(--ink);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* 頂部工具列（非卡片，懸浮標籤風格） */
    .top-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .pill-btn {
      background: var(--cream);
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .pill-btn.active {
      background: var(--gold);
    }

    /* 販賣機主機體 */
    .vending-machine {
      width: 100%;
      max-width: 440px;
      background: var(--orange);
      border: 4px solid var(--ink);
      border-radius: 28px 28px 18px 18px;
      box-shadow: 10px 10px 0 var(--ink);
      padding: 18px 18px 22px;
      position: relative;
      transition: transform 0.08s;
    }

    /* 機台震動動畫 */
    .vending-machine.shaking {
      animation: machineShake 0.45s ease-in-out;
    }

    @keyframes machineShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, 2px) rotate(-0.8deg); }
      40% { transform: translate(4px, -2px) rotate(0.8deg); }
      60% { transform: translate(-3px, -1px) rotate(-0.5deg); }
      80% { transform: translate(3px, 2px) rotate(0.5deg); }
    }

    /* 復古燈箱招牌 */
    .marquee {
      background: var(--cream);
      border: 3.5px solid var(--ink);
      border-radius: 14px;
      padding: 10px 12px;
      text-align: center;
      margin-bottom: 16px;
      position: relative;
      box-shadow: inset 0 -4px 0 var(--cream-dark);
    }

    .marquee-sub {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--orange);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .marquee-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--green);
    }

    /* 櫥窗顯示區 */
    .display-window {
      background: var(--green);
      border: 3.5px solid var(--ink);
      border-radius: 16px;
      padding: 14px;
      color: var(--cream);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    /* 櫥窗玻璃反光線條 */
    .display-window::after {
      content: "";
      position: absolute;
      top: -20%;
      right: 12%;
      width: 24px;
      height: 150%;
      background: rgba(246, 240, 225, 0.08);
      transform: rotate(22deg);
      pointer-events: none;
    }

    .step-badge {
      display: inline-block;
      background: var(--orange);
      color: var(--cream);
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    /* 人生方向選擇按鈕（嵌在櫥窗內的實體按鍵） */
    .direction-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .dir-btn {
      background: var(--cream);
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--ink);
      transition: all 0.12s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .dir-btn:hover {
      background: #FFF9EC;
    }

    .dir-btn.selected {
      background: var(--gold);
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .dir-btn .dir-code {
      font-size: 11px;
      font-weight: 900;
      color: var(--orange-dark);
      font-family: monospace;
    }

    .dir-btn .dir-name {
      font-size: 15px;
      font-weight: 900;
    }

    .dir-btn .dir-desc {
      font-size: 11px;
      opacity: 0.85;
      line-height: 1.3;
    }

    /* 操作面板區（投幣口 + LED 狀態 + 拉桿按鈕） */
    .control-deck {
      background: var(--cream-dark);
      border: 3.5px solid var(--ink);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .led-screen {
      flex: 1;
      background: var(--ink);
      color: #88E5B3;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.4;
      min-height: 52px;
      display: flex;
      align-items: center;
    }

    .led-screen.warn {
      color: #FFB07C;
    }

    .action-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 復古投幣孔 */
    .coin-slot {
      width: 24px;
      height: 46px;
      background: #9E9480;
      border: 3px solid var(--ink);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .coin-slot::before {
      content: "";
      width: 4px;
      height: 26px;
      background: var(--ink);
      border-radius: 2px;
    }

    .coin-anim {
      position: absolute;
      width: 22px;
      height: 22px;
      background: var(--gold);
      border: 2.5px solid var(--ink);
      border-radius: 50%;
      top: -28px;
      opacity: 0;
      pointer-events: none;
    }

    .coin-anim.drop {
      animation: coinDrop 0.45s cubic-bezier(0.5, 0, 0.75, 0.9);
    }

    @keyframes coinDrop {
      0% { top: -28px; opacity: 1; transform: scaleY(1); }
      70% { top: 8px; opacity: 1; transform: scaleY(0.4); }
      100% { top: 14px; opacity: 0; transform: scaleY(0.1); }
    }

    /* 大型實體啟動按鈕 */
    .dispense-btn {
      background: var(--green);
      color: var(--cream);
      border: 3.5px solid var(--ink);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.15s;
      white-space: nowrap;
    }

    .dispense-btn:hover:not(:disabled) {
      background: var(--green-light);
    }

    .dispense-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .dispense-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* 取票口（出票槽） */
    .dispenser-bay {
      background: var(--ink);
      border-radius: 14px;
      padding: 12px 14px 16px;
      position: relative;
    }

    .dispenser-slit {
      height: 10px;
      background: #0B1612;
      border-radius: 5px;
      margin-bottom: 8px;
      border-bottom: 2px solid #2D4A40;
    }

    .dispenser-hint {
      text-align: center;
      color: var(--cream-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      opacity: 0.7;
      padding: 12px 0;
    }

    /* 抽出的復古車票 / 人生票券 */
    .ticket-wrapper {
      overflow: hidden;
      display: none;
    }

    .ticket-wrapper.visible {
      display: block;
    }

    .ticket {
      background: var(--cream);
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 8px;
      padding: 16px;
      position: relative;
      transform-origin: top center;
      animation: printTicket 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      background-image: radial-gradient(circle at 0 50%, var(--ink) 7px, transparent 7.5px),
                        radial-gradient(circle at 100% 50%, var(--ink) 7px, transparent 7.5px);
    }

    @keyframes printTicket {
      0% { transform: translateY(-105%); }
      40% { transform: translateY(-55%); }
      70% { transform: translateY(-20%); }
      100% { transform: translateY(0%); }
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--ink);
      padding-bottom: 8px;
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 800;
      color: var(--orange-dark);
    }

    .ticket-title {
      font-size: 19px;
      font-weight: 900;
      color: var(--green);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .ticket-world {
      display: inline-block;
      background: var(--green);
      color: var(--cream);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .ticket-story {
      font-size: 14px;
      line-height: 1.65;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .ticket-quote {
      background: var(--cream-dark);
      border-left: 4px solid var(--orange);
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 14px;
    }

    .ticket-actions {
      display: flex;
      gap: 8px;
      border-top: 2px dashed var(--ink);
      padding-top: 12px;
    }

    .ticket-btn {
      flex: 1;
      padding: 9px 10px;
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform 0.1s;
    }

    .ticket-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn-save {
      background: var(--gold);
      color: var(--ink);
    }

    .btn-save.saved {
      background: var(--green);
      color: var(--cream);
    }

    .btn-reset {
      background: var(--cream);
      color: var(--ink);
    }

    /* 機台底座腳架 */
    .machine-feet {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
    }

    .foot {
      width: 44px;
      height: 14px;
      background: var(--green);
      border: 3.5px solid var(--ink);
      border-top: none;
      border-radius: 0 0 8px 8px;
    }

    /* 收藏抽屜 Modal */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(23, 43, 36, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .drawer-overlay.open {
      display: flex;
    }

    .drawer-box {
      width: 100%;
      max-width: 420px;
      max-height: 82dvh;
      background: var(--cream);
      border: 4px solid var(--ink);
      border-radius: 20px;
      box-shadow: 8px 8px 0 var(--ink);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .drawer-header {
      background: var(--green);
      color: var(--cream);
      padding: 14px 16px;
      border-bottom: 3.5px solid var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-header h2 {
      font-size: 17px;
      font-weight: 900;
    }

    .close-drawer {
      background: var(--orange);
      color: var(--cream);
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .saved-list {
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .saved-item {
      background: #FFFDF7;
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      padding: 12px;
      position: relative;
    }

    .saved-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--orange-dark);
      margin-bottom: 4px;
    }

    .saved-item-title {
      font-size: 15px;
      font-weight: 900;
      color: var(--green);
      margin-bottom: 4px;
    }

    .saved-item-desc {
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .del-btn {
      background: none;
      border: none;
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 800;
      text-decoration: underline;
      cursor: pointer;
    }

    .empty-msg {
      text-align: center;
      padding: 32px 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
    }

    @media (max-width: 380px) {
      .marquee-title { font-size: 19px; }
      .dir-btn .dir-name { font-size: 14px; }
      .dispense-btn { padding: 12px 12px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- 頂部功能按鈕 -->
  <div class="top-bar">
    <button type="button" class="pill-btn active" id="soundToggle" aria-label="切換音效">
      <span id="soundIcon">🔊</span> <span id="soundLabel">音效：開</span>
    </button>
    <button type="button" class="pill-btn" id="openCollectionBtn">
      🎫 票券收藏冊 (<span id="savedCount">0</span>)
    </button>
  </div>

  <!-- 復古平行人生販賣機主體 -->
  <main class="vending-machine" id="machineBody">
    <header class="marquee">
      <div class="marquee-sub">PARALLEL LIFE DISPENSER • EST. 1986</div>
      <h1 class="marquee-title">平行人生販賣機</h1>
    </header>

    <!-- 櫥窗：步驟一 選擇人生方向 -->
    <section class="display-window">
      <div class="step-badge">STEP 1 • 選擇你的平行時空頻道</div>
      <div class="direction-grid" id="directionGrid">
        <button type="button" class="dir-btn" data-dir="wander">
          <span class="dir-code">[ A-01 ]</span>
          <span class="dir-name">🌊 浪跡天涯</span>
          <span class="dir-desc">離開熟悉城市，在異地重新認識自己</span>
        </button>
        <button type="button" class="dir-btn" data-dir="craft">
          <span class="dir-code">[ B-02 ]</span>
          <span class="dir-name">🛠️ 職人手作</span>
          <span class="dir-desc">把熱愛變成日常，用雙手打磨時光</span>
        </button>
        <button type="button" class="dir-btn" data-dir="adventure">
          <span class="dir-code">[ C-03 ]</span>
          <span class="dir-name">🚀 奇想冒險</span>
          <span class="dir-desc">打破常規劇本，闖入意想不到的舞台</span>
        </button>
        <button type="button" class="dir-btn" data-dir="slow">
          <span class="dir-code">[ D-04 ]</span>
          <span class="dir-name">🍵 靜謐慢活</span>
          <span class="dir-desc">關掉焦慮鬧鐘，過一種有微風的生活</span>
        </button>
      </div>
    </section>

    <!-- 操作台：步驟二 投幣並抽取票券 -->
    <section class="control-deck">
      <div class="led-screen" id="ledDisplay">請先在上方選擇一個人生方向...</div>
      <div class="action-controls">
        <div class="coin-slot" title="時空代幣投入口">
          <div class="coin-anim" id="coinAnim"></div>
        </div>
        <button type="button" class="dispense-btn" id="dispenseBtn">
          投入代幣<br>抽取人生
        </button>
      </div>
    </section>

    <!-- 出票口：步驟三 領取與收藏票券 -->
    <section class="dispenser-bay">
      <div class="dispenser-slit"></div>
      <div class="dispenser-hint" id="dispenserHint">▼ 票券出口（PUSH） ▼</div>

      <div class="ticket-wrapper" id="ticketWrapper">
        <article class="ticket" id="ticketCard">
          <div class="ticket-header">
            <span id="ticketCode">NO. #0000</span>
            <span id="ticketDirTag">平行頻道</span>
          </div>
          <h2 class="ticket-title" id="ticketTitle">平行人生標題</h2>
          <div class="ticket-world" id="ticketWorld">座標：未知時空</div>
          <p class="ticket-story" id="ticketStory">人生故事內容...</p>
          <div class="ticket-quote" id="ticketQuote">「給現在的你的一句話」</div>
          <div class="ticket-actions">
            <button type="button" class="ticket-btn btn-save" id="saveTicketBtn">★ 收藏這張票券</button>
            <button type="button" class="ticket-btn btn-reset" id="resetBtn">↻ 重新開始</button>
          </div>
        </article>
      </div>
    </section>
  </main>

  <div class="machine-feet">
    <div class="foot"></div>
    <div class="foot"></div>
  </div>

  <!-- 票券收藏冊視窗 -->
  <div class="drawer-overlay" id="collectionModal">
    <div class="drawer-box">
      <div class="drawer-header">
        <h2>🎫 我的平行人生收藏冊</h2>
        <button type="button" class="close-drawer" id="closeCollectionBtn">關閉</button>
      </div>
      <div class="saved-list" id="savedList"></div>
    </div>
  </div>

  <script>
    // 1. 平行人生資料庫（豐富內建，無需連線）
    const LIFE_DATA = {
      wander: {
        label: "A-01 浪跡天涯",
        items: [
          {
            title: "瀨戶內海的渡輪售票員",
            world: "座標：日本香川縣 • 晴朗海風線",
            story: "你在三十歲那年買了單程機票，最後在一座只有兩百人的小島停下。每天早上七點為第一班渡輪剪票，下午在堤防邊看橘色夕陽沉入海面，全島的貓都認得你的腳步聲。",
            quote: "「有些風景，只有當你不再趕時間時才會出現。」"
          },
          {
            title: "冰島環島公路的極光攝影師",
            world: "座標：雷克雅維克以北 • 零下三度線",
            story: "你開著一輛改裝老麵包車追逐雲層縫隙。雖然常常在寒風中啃冷掉的三明治，但當綠色光幕在頭頂無聲舞動時，你覺得自己擁有整座宇宙。",
            quote: "「世界很大，大到足以裝下你所有的猶豫與勇敢。」"
          },
          {
            title: "里斯本黃色電車上的寫生畫家",
            world: "座標：葡萄牙阿爾法瑪區 • 坡道陽光線",
            story: "你隨身帶著一本水彩本，專門在 28 號電車搖搖晃晃的車廂裡速寫乘客的側臉。你用畫作換過無數杯濃縮咖啡與剛出爐的蛋撻。",
            quote: "「迷路不是浪費時間，而是為了遇見地圖外的故事。」"
          }
        ]
      },
      craft: {
        label: "B-02 職人手作",
        items: [
          {
            title: "深夜巷弄的舊書修復師",
            world: "座標：京都寺町通 • 紙香微光線",
            story: "你的工作檯上永遠擺著漿糊、細麻線與放大鏡。你替人們把受潮泛黃的童年繪本、爺爺留下的筆記本一頁頁重新裝訂，讓記憶得以繼續呼吸。",
            quote: "「慢下來做的事，時間會幫你留住溫度。」"
          },
          {
            title: "海邊小鎮的天然酵母麵包師",
            world: "座標：台東都蘭 • 凌晨四點麥香線",
            story: "每天天還沒亮，你就開始揉麵團、觀察氣溫與濕度。當第一爐海鹽可頌出爐的香氣飄過街角，整座小鎮才真正醒過來。",

          {

            story: "你專門幫忙碌的上班族在都市角落打造秘密樹屋、地下書房與星空帳篷。你堅信不管幾歲，每個人心裡都還住著一個想躲進紙箱裡的孩子。",

      },
      slow: {
        label: "D-04 靜謐慢活",
        items: [
          {
            title: "山腰茶園的節氣茶農",
            world: "座標：南投鹿谷 • 晨霧雲海線",
            story: "你不再看手機行事曆，而是跟著立春、穀雨、白露過日子。午後雲霧湧上山頭時，你就坐在屋簷下泡一壺自家烘焙的烏龍茶，聽風吹過竹林。",

          },
          {
            title: "只賣三種湯的社區深夜食堂主理人",
            world: "座標：台中舊城區 • 暖黃燈籠線",
            story: "你的小店只有八個座位，每晚只煮玉米排骨湯、味噌豆腐湯與番茄牛肉湯。下班晚歸的人推開門喝完一碗熱湯，緊皺的眉頭就鬆開了。",

          {

            world: "座標：宜蘭福山 • 濕潤綠意線",
            story: "你每天的工作是替三百多種苔蘚噴水霧、記錄孢子生長。這裡沒有喧鬧的掌聲，但每一片在石縫中靜靜舒展的綠葉，都讓你感到無比踏實。",
            quote: "「安靜生長的力量，比任何喧嘩都更長久。」"

    // 2. Web Audio API 復古音效合成器（免外部檔案）
    class RetroSound {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      playTone(freq, type, duration, delay = 0, vol = 0.15) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration);
      }

      click() {
        this.playTone(520, "square", 0.06, 0, 0.1);
        this.playTone(780, "square", 0.05, 0.04, 0.08);
      }

      coin() {
        this.playTone(987.77, "sine", 0.08, 0, 0.18);     // B5
        this.playTone(1318.51, "sine", 0.25, 0.08, 0.18); // E6
      }

      dispense() {
        // 機械齒輪運轉 + 出票提示音
        const notes = [220, 260, 300, 340, 392, 523.25];
        notes.forEach((n, idx) => {
          this.playTone(n, "triangle", 0.09, idx * 0.07, 0.12);
        });
      }

      save() {
        this.playTone(587.33, "sine", 0.1, 0, 0.15);
        this.playTone(880, "sine", 0.2, 0.09, 0.15);
      }

      error() {
        this.playTone(180, "sawtooth", 0.15, 0, 0.12);
      }
    }

    const sfx = new RetroSound();

    // 3. 狀態與 DOM 綁定
    let selectedDir = null;
    let currentTicket = null;
    let isDispensing = false;
    const STORAGE_KEY = "parallel_life_tickets_v1";

    const machineBody = document.getElementById("machineBody");
    const dirButtons = document.querySelectorAll(".dir-btn");
    const ledDisplay = document.getElementById("ledDisplay");
    const dispenseBtn = document.getElementById("dispenseBtn");
    const coinAnim = document.getElementById("coinAnim");
    const dispenserHint = document.getElementById("dispenserHint");
    const ticketWrapper = document.getElementById("ticketWrapper");
    const saveTicketBtn = document.getElementById("saveTicketBtn");
    const resetBtn = document.getElementById("resetBtn");

    // 音效開關
    const soundToggle = document.getElementById("soundToggle");
    const soundIcon = document.getElementById("soundIcon");
    const soundLabel = document.getElementById("soundLabel");

    soundToggle.addEventListener("click", () => {
      sfx.enabled = !sfx.enabled;
      soundToggle.classList.toggle("active", sfx.enabled);
      soundIcon.textContent = sfx.enabled ? "🔊" : "🔇";
      soundLabel.textContent = sfx.enabled ? "音效：開" : "音效：關";
      if (sfx.enabled) sfx.click();
    });

    // 選擇人生方向
    dirButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        if (isDispensing) return;
        sfx.click();

        dirButtons.forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedDir = btn.dataset.dir;

        const label = LIFE_DATA[selectedDir].label;
        ledDisplay.classList.remove("warn");
        ledDisplay.textContent = `已鎖定頻道：${label}，請按右側抽取！`;
      });
    });

    // 抽取平行人生票券
    dispenseBtn.addEventListener("click", () => {
      if (isDispensing) return;

      if (!selectedDir) {
        sfx.error();
        ledDisplay.classList.add("warn");
        ledDisplay.textContent = "⚠ 尚未選擇方向！請先點選上方頻道按鈕。";
        machineBody.classList.remove("shaking");
        void machineBody.offsetWidth;
        machineBody.classList.add("shaking");
        return;
      }

      isDispensing = true;
      dispenseBtn.disabled = true;

      // 投幣動畫與音效
      sfx.coin();
      coinAnim.classList.remove("drop");
      void coinAnim.offsetWidth;
      coinAnim.classList.add("drop");

      ledDisplay.classList.remove("warn");
      ledDisplay.textContent = "時空校準中... 正在列印你的平行人生...";

      // 先收起舊票券
      ticketWrapper.classList.remove("visible");
      dispenserHint.style.display = "block";
      dispenserHint.textContent = "⚙ 齒輪運轉中，請稍候...";

      setTimeout(() => {
        sfx.dispense();
        machineBody.classList.remove("shaking");
        void machineBody.offsetWidth;
        machineBody.classList.add("shaking");

        // 隨機抽取該方向的一張人生票券（避免連續重複）
        const pool = LIFE_DATA[selectedDir].items;
        let candidate;
        do {
          candidate = pool[Math.floor(Math.random() * pool.length)];
        } while (pool.length > 1 && currentTicket && candidate.title === currentTicket.title);

        const serialNo = "NO. #" + Math.floor(1000 + Math.random() * 9000);
        currentTicket = {
          id: Date.now(),
          code: serialNo,
          dirLabel: LIFE_DATA[selectedDir].label,
          ...candidate
        };

        // 填入票券內容
        document.getElementById("ticketCode").textContent = currentTicket.code;
        document.getElementById("ticketDirTag").textContent = currentTicket.dirLabel;
        document.getElementById("ticketTitle").textContent = currentTicket.title;
        document.getElementById("ticketWorld").textContent = currentTicket.world;
        document.getElementById("ticketStory").textContent = currentTicket.story;
        document.getElementById("ticketQuote").textContent = currentTicket.quote;

        // 重設收藏按鈕狀態
        saveTicketBtn.textContent = "★ 收藏這張票券";
        saveTicketBtn.classList.remove("saved");
        saveTicketBtn.disabled = false;

        // 顯示出票動畫
        dispenserHint.style.display = "none";
        ticketWrapper.classList.add("visible");
        ledDisplay.textContent = "出票完成！請領取下方的平行人生票券。";

        isDispensing = false;
        dispenseBtn.disabled = false;
      }, 650);
    });

    // 收藏票券功能（LocalStorage）
    function getSavedTickets() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function updateSavedCount() {
      const list = getSavedTickets();
      document.getElementById("savedCount").textContent = list.length;
    }

    saveTicketBtn.addEventListener("click", () => {
      if (!currentTicket) return;
      const list = getSavedTickets();

      // 避免重複收藏同一張票號
      if (!list.some((item) => item.code === currentTicket.code)) {
        list.unshift(currentTicket);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        updateSavedCount();
      }

      sfx.save();
      saveTicketBtn.textContent = "✔ 已收入收藏冊";
      saveTicketBtn.classList.add("saved");
      saveTicketBtn.disabled = true;
    });

    // 重新開始
    resetBtn.addEventListener("click", () => {
      sfx.click();
      selectedDir = null;
      currentTicket = null;
      dirButtons.forEach((b) => b.classList.remove("selected"));
      ticketWrapper.classList.remove("visible");
      dispenserHint.style.display = "block";
      dispenserHint.textContent = "▼ 票券出口（PUSH） ▼";
      ledDisplay.classList.remove("warn");
      ledDisplay.textContent = "已重置！請重新選擇一個人生方向...";
    });

    // 收藏冊 Modal 操作
    const collectionModal = document.getElementById("collectionModal");
    const openCollectionBtn = document.getElementById("openCollectionBtn");
    const closeCollectionBtn = document.getElementById("closeCollectionBtn");
    const savedListEl = document.getElementById("savedList");

    function renderSavedList() {
      const list = getSavedTickets();
      if (list.length === 0) {
        savedListEl.innerHTML = `<div class="empty-msg">目前還沒有收藏任何票券喔！<br>快去操作販賣機抽一張吧 🎫</div>`;
        return;
      }

      savedListEl.innerHTML = list.map((item, index) => `
        <div class="saved-item">
          <div class="saved-item-top">
            <span>${item.code} • ${item.dirLabel}</span>
            <button type="button" class="del-btn" data-index="${index}">移除</button>
          </div>
          <div class="saved-item-title">${item.title}</div>
          <div class="saved-item-desc">${item.story}</div>
          <div style="font-size:12px; font-weight:700; color:var(--orange-dark);">${item.quote}</div>
        </div>
      `).join("");

      savedListEl.querySelectorAll(".del-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          sfx.click();
          const idx = Number(e.target.dataset.index);
          const updated = getSavedTickets();
          updated.splice(idx, 1);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
          updateSavedCount();
          renderSavedList();
        });
      });
    }

    openCollectionBtn.addEventListener("click", () => {
      sfx.click();
      renderSavedList();
      collectionModal.classList.add("open");
    });

    closeCollectionBtn.addEventListener("click", () => {
      sfx.click();
      collectionModal.classList.remove("open");
    });

    collectionModal.addEventListener("click", (e) => {
      if (e.target === collectionModal) {
        collectionModal.classList.remove("open");
      }
    });

    // 初始化收藏數量
    updateSavedCount();
  </script>
